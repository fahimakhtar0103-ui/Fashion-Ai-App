name: iOS Build Check

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Build iOS without code signing
        run: flutter build ios --release --no-codesign

      - name: Package iOS app build
        run: |
          cd build/ios/iphoneos
          ditto -c -k --sequesterRsrc --keepParent Runner.app fashion-ai-ios-unsigned-app.zip

      - name: Upload iOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fashion-ai-ios-unsigned-app
          path: build/ios/iphoneos/fashion-ai-ios-unsigned-app.zip
          if-no-files-found: error
