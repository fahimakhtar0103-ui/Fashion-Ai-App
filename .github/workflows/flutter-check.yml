name: Flutter Frontend Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android and iOS project folders
        run: flutter create . --platforms=android,ios --project-name=fashion_ai_app

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build ONE universal Android APK
        run: |
          rm -rf dist
          mkdir -p dist
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk dist/Fashion-AI.apk

      - name: Verify artifact contains exactly one APK
        shell: bash
        run: |
          test -s dist/Fashion-AI.apk
          unzip -t dist/Fashion-AI.apk >/dev/null
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 1
          ls -lh dist

      - name: Upload ONE universal Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Fashion-AI-ONE-APK
          path: dist/Fashion-AI.apk
          if-no-files-found: error
