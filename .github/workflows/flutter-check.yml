name: Flutter Frontend Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android and iOS project folders
        run: flutter create . --platforms=android,ios --project-name=fashion_ai_app

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build universal Android APK
        run: |
          flutter build apk --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Fashion-AI-universal.apk

      - name: Build ABI-specific Android APKs
        run: |
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/Fashion-AI-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/Fashion-AI-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/Fashion-AI-x86_64.apk

      - name: Validate APK files
        shell: bash
        run: |
          for apk in dist/*.apk; do
            echo "Validating $apk"
            test -s "$apk"
            unzip -t "$apk" >/dev/null
          done
          ls -lh dist

      - name: Add install note
        run: |
          cat > dist/INSTALL.txt <<'EOF'
          Android install:
          1. Extract this GitHub artifact ZIP first.
          2. Try Fashion-AI-universal.apk.
          3. If your phone says unsupported, use Fashion-AI-arm64-v8a.apk (most modern Android phones).
          4. Allow "Install unknown apps" for the browser/file manager if Android asks.
          EOF

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: fashion-ai-android-apks
          path: dist/*
          if-no-files-found: error
