name: Flutter Frontend Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android and iOS project folders
        run: flutter create . --platforms=android,ios --project-name=fashion_ai_app

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build universal Android APK
        run: |
          flutter build apk --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Fashion-AI.apk

      - name: Validate universal APK
        shell: bash
        run: |
          test -s dist/Fashion-AI.apk
          unzip -t dist/Fashion-AI.apk >/dev/null
          ls -lh dist/Fashion-AI.apk

      - name: Upload universal Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Fashion-AI-Universal-APK
          path: dist/Fashion-AI.apk
          if-no-files-found: error
